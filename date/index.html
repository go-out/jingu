<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <title>神宮の一年 Jingu Annual Ceremonies</title>
    <meta content="恒例祭典・行事と催し" name="description" />
    <link rel="icon" href="/sdk/assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/sdk/assets/fonts/font-face.css" />

    <link rel="stylesheet" href="/sdk/css/latest/style.css" />
    <link rel="stylesheet" href="/sdk/css/latest/date.css" />

    <script type="module">
        import {indexJSON} from "/sdk/js/latest/date.js";

        const params = new URLSearchParams(location.search);
        let thisJSON, thisArea;
        const thisPath = "../";
        if (location.search) {
            if (params.get("map")) {
                thisJSON = "../" + params.get("map").replaceAll("-", "/");
                if (params.get("area")) {
                    thisArea = params.get("area").replaceAll("-", '/');
                    thisJSON += `/${thisArea}`;
                };
                if (params.get("name")) {
                    thisJSON += `/${params.get("name")}.json`;
                } else {
                    thisJSON += "/date.json";
                };
            } else {
                thisJSON = "./";
                if (params.get("id")) {
                    // ?id=ID&name=名前
                    thisJSON += params.get("id").replaceAll("-", "/") + "/";
                    if (params.get("name")) {
                        thisJSON += params.get("name") + ".json";
                    } else {
                        thisJSON += "date.json";
                    };
                } else {
                    if (params.get("name")) {
                        thisJSON += params.get("name") + ".json";
                    } else {
                        thisJSON += "date.json";
                    };
                };
            };
            indexJSON(thisJSON, thisPath);
        } else {
            indexJSON("./202609.json", thisPath);
        };
    </script>
</head>

<body>
    <header>
        <nav>
            <input type="button" id="latest" value="Latest Update" />
        </nav>
        <h1>
            <u>恒例祭典・行事と催し</u>
            <strong>神宮の一年</strong>
        </h1>
        <h2>
            <small>Jingu Annual Ceremonies</small>
            <i>神宮（伊勢・元伊勢）</i>
        </h2>
    </header>

    <article id="readme">
        <nav>
            <h3>目次</h3>
        </nav>
        <section>
            <div id="notes"></div>
            <aside id="links" hidden></aside>
        </section>
    </article>
</body>

</html>
